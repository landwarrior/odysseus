# 開発用の自動再起動設定です。リポジトリ根で `air` を実行します。
# HTML/CSS は ODYSSEUS_DEV=1 でディスクから都度読むため、Go の変更だけを監視します。

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/odysseus.exe"
  cmd = "go build -o ./tmp/odysseus.exe ./cmd/odysseus"
  delay = 800
  exclude_dir = ["tmp", "data", "vendor", "testdata", ".git"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = false
  # Windows ではポーリングの方が取りこぼしにくいです。
  poll = true
  poll_interval = 500

[env]
  ODYSSEUS_HTTP_ADDR = "127.0.0.1:8080"
  ODYSSEUS_OPEN_BROWSER = "0"
  ODYSSEUS_DEV = "1"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = true
